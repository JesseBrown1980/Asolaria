name: CPU-only Mythos GGUF glyph27 learner and held-out baselines
on:
  push:
    paths:
      - '.github/workflows/mythos-glyph27-cpu.yml'
      - 'MYTHOS-BLUE-STAR/glyph27/**'
  pull_request:
    paths:
      - '.github/workflows/mythos-glyph27-cpu.yml'
      - 'MYTHOS-BLUE-STAR/glyph27/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu_only:
    name: Train and audit Mythos glyph27 CPU models
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU NumPy only
        run: |
          python -m pip install 'numpy==2.2.6'
      - name: Check original artifact and precommitted experiment
        run: |
          set -euo pipefail
          (cd MYTHOS-BLUE-STAR && sha256sum -c ACER-MYTHOS-BLUE.gguf.sha256)
          grep -Fq 'MYTHOS_GLYPH_FREEZE|schema=MYTHOS-GLYPH27-HELDOUT-V1|' MYTHOS-BLUE-STAR/glyph27/FROZEN-GLYPH27-HELDOUT-20261112.hbp
          test "$(stat -c '%s' MYTHOS-BLUE-STAR/ACER-MYTHOS-BLUE.gguf)" -eq 50752
          python -m py_compile MYTHOS-BLUE-STAR/glyph27/train_glyph27_cpu.py
      - name: Train learned spatial and glyph-language heads on CPU only
        run: |
          set -euo pipefail
          mkdir -p build/mythos-glyph27
          python -B MYTHOS-BLUE-STAR/glyph27/train_glyph27_cpu.py \
            --source MYTHOS-BLUE-STAR/ACER-MYTHOS-BLUE.gguf \
            --out build/mythos-glyph27 | tee build/mythos-glyph27/EXECUTION.hbp
          grep -Fq 'MYTHOS_SOURCE|bytes=50752|sha256=3dd92a42160a38c121980957ce9eabbea216678892801d7ea3ed4e99e96c3aae|' build/mythos-glyph27/EXECUTION.hbp
          grep -Fq 'MYTHOS_GLYPH27_COMPLETE|status=PASS|training=CPU_ONLY|codec_exact=PASS|neural_test_metrics=MEASURED|' build/mythos-glyph27/EXECUTION.hbp
          (cd build/mythos-glyph27 && sha256sum -c SHA256SUMS)
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('build/mythos-glyph27/REPORT.json').read_text())
          assert r['vocabulary_size']==27 and r['compression']['bit_exact_roundtrip']
          assert r['split_examples']=={'train':2560,'validation':768,'test':768}
          assert r['training_device']=='CPU_ONLY_NUMPY'
          assert r['next_glyph_test_size']==2016
          for name, x in r['binary_models'].items():
              for sample in x['test']:
                  assert sample['positive']+sample['tn']+sample['fp']==sample['n']
                  assert sample['tp']+sample['fn']==sample['positive']
          assert r['binary_models']['all_empty']['test'][0]['recall']==0
          print('MYTHOS_GLYPH27_METRICS_AUDIT|status=PASS|no_test_train_overlap=YES|json=0')
          PY
      - name: Independent source-byte mutation and glyph checksum sabotage
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          source=Path('MYTHOS-BLUE-STAR/ACER-MYTHOS-BLUE.gguf').read_bytes()
          assert sha256(source).hexdigest()=='3dd92a42160a38c121980957ce9eabbea216678892801d7ea3ed4e99e96c3aae'
          altered=source[:900]+bytes([source[900]^1])+source[901:]
          assert sha256(altered).hexdigest()!=sha256(source).hexdigest()
          result=Path('build/mythos-glyph27/GLYPH27.bin').read_bytes()
          assert len(result)==7680
          altered_glyph=bytes([result[0]^1])+result[1:]
          assert sha256(altered_glyph).hexdigest()!=sha256(result).hexdigest()
          print('MYTHOS_GLYPH27_TAMPER|source_mutation_detected=YES|glyph_mutation_detected=YES|json=0')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mythos-glyph27-cpu-heldout-model-and-evaluation
          path: build/mythos-glyph27
          retention-days: 30
          if-no-files-found: warn
